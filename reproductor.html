<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Reproductor Musical Pro</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --bg-card: #111827;
            --bg-surface: #1a1f2e;
            --bg-input: #0f1520;
            --primary: #00c6ff;
            --primary-dark: #0072ff;
            --accent: #00f2fe;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #1e293b;
            --border-light: #263348;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --radius: 20px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --shadow-lg: 0 25px 60px rgba(0, 0, 0, 0.6);
            --shadow-card: 0 8px 30px rgba(0, 0, 0, 0.4);
            --glow-primary: 0 0 25px rgba(0, 198, 255, 0.3);
            --glow-accent: 0 0 25px rgba(0, 242, 254, 0.3);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-dark);
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(0, 198, 255, 0.08) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 80%, rgba(0, 114, 255, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 242, 254, 0.03) 0%, transparent 70%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .screen {
            width: 100%;
            max-width: 460px;
            background: var(--bg-card);
            border-radius: 28px;
            padding: 30px 26px;
            box-shadow: var(--shadow-lg), 0 0 0 1px var(--border);
            position: relative;
            overflow: hidden;
            animation: fadeSlideIn 0.5s ease;
            transition: all var(--transition);
        }

        .screen::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(0, 198, 255, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(0, 114, 255, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .screen > * { position: relative; z-index: 1; }

        .hidden { display: none !important; }
        .hidden-panel { display: none !important; }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 198, 255, 0.3); }
            50% { box-shadow: 0 0 35px rgba(0, 242, 254, 0.6); }
        }
        @keyframes equalizer {
            0%, 100% { height: 6px; }
            50% { height: 20px; }
        }

        #login-screen { text-align: center; }
        #login-screen .login-icon {
            font-size: 3.8rem; display: block; margin-bottom: 12px;
            animation: pulse 2s infinite;
        }
        #login-screen h2 {
            font-size: 1.9rem; font-weight: 700; margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #login-screen p { color: var(--text-secondary); margin-bottom: 24px; font-size: 0.92rem; }
        #username-input {
            width: 100%; padding: 15px 18px; border-radius: var(--radius-sm);
            border: 2px solid var(--border); background: var(--bg-input);
            color: var(--text); font-size: 1rem; outline: none;
            transition: all var(--transition); margin-bottom: 18px;
            text-align: center; letter-spacing: 0.02em;
        }
        #username-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0,198,255,0.12); }
        #username-input::placeholder { color: var(--text-muted); }
        #start-btn {
            width: 100%; padding: 15px; border-radius: var(--radius-sm); border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff; font-size: 1.05rem; font-weight: 600; cursor: pointer;
            transition: all var(--transition); box-shadow: 0 10px 28px rgba(0,114,255,0.35);
        }
        #start-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 38px rgba(0,114,255,0.5); }
        #start-btn:active { transform: scale(0.97); }

        #greeting-text {
            font-size: 1.25rem; font-weight: 600; margin-bottom: 18px;
            color: var(--text); display: flex; align-items: center; gap: 8px;
        }
        #greeting-text .wave { display: inline-block; animation: pulse 1.5s infinite; }

        .logout-btn {
            position: absolute; top: 18px; right: 18px;
            background: rgba(255,255,255,0.04); border: 1px solid var(--border-light);
            color: var(--text-muted); padding: 7px 16px; border-radius: 20px;
            cursor: pointer; font-size: 0.75rem; transition: all var(--transition);
            z-index: 5; backdrop-filter: blur(4px);
        }
        .logout-btn:hover { color: var(--danger); border-color: var(--danger); background: rgba(239,68,68,0.08); }

        .mini-player {
            background: var(--bg-surface); border-radius: var(--radius);
            padding: 24px 18px 20px; margin-bottom: 22px;
            border: 1px solid var(--border-light); box-shadow: var(--shadow-card);
            position: relative; overflow: hidden;
        }
        .mini-player::after {
            content: ''; position: absolute; top: -30px; right: -30px;
            width: 120px; height: 120px;
            background: radial-gradient(circle, rgba(0,198,255,0.15) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none; z-index: 0;
        }

        .album-art {
            width: 110px; height: 110px; border-radius: 16px;
            margin: 0 auto 14px; background: linear-gradient(135deg, #0072ff, #00c6ff);
            background-size: cover; background-position: center; background-repeat: no-repeat;
            box-shadow: var(--glow-primary); animation: glowPulse 3s infinite;
            position: relative; z-index: 1; display: flex; align-items: center;
            justify-content: center; font-size: 3rem; color: rgba(255,255,255,0.7);
            transition: all var(--transition); overflow: hidden;
        }
        .album-art.playing-animation { animation: glowPulse 1.5s infinite; transform: scale(1.02); }
        .album-art img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }

        .equalizer {
            display: flex; align-items: flex-end; justify-content: center;
            gap: 3px; height: 22px; margin-bottom: 8px; position: relative; z-index: 1;
        }
        .equalizer .bar {
            width: 3px; background: var(--primary); border-radius: 2px;
            transition: height 0.15s ease;
        }
        .equalizer .bar:nth-child(1) { animation: equalizer 0.8s infinite ease-in-out; animation-delay: 0s; }
        .equalizer .bar:nth-child(2) { animation: equalizer 0.8s infinite ease-in-out; animation-delay: 0.2s; }
        .equalizer .bar:nth-child(3) { animation: equalizer 0.8s infinite ease-in-out; animation-delay: 0.4s; }
        .equalizer .bar:nth-child(4) { animation: equalizer 0.8s infinite ease-in-out; animation-delay: 0.6s; }
        .equalizer .bar:nth-child(5) { animation: equalizer 0.8s infinite ease-in-out; animation-delay: 0.3s; }
        .equalizer.stopped .bar { animation: none; height: 3px; }

        .song-info { text-align: center; margin-bottom: 16px; position: relative; z-index: 1; }
        .song-info h4 {
            font-size: 1.1rem; font-weight: 600; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .song-info p {
            font-size: 0.82rem; color: var(--text-secondary); margin-top: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .now-playing-badge {
            display: inline-block; background: rgba(0,198,255,0.15);
            color: var(--primary); font-size: 0.65rem; padding: 5px 12px;
            border-radius: 20px; margin-bottom: 10px;
            letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600;
        }

        .progress-container {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 16px; position: relative; z-index: 1;
        }
        .progress-container span {
            font-size: 0.7rem; color: var(--text-muted); min-width: 34px;
            text-align: center; font-family: 'SF Mono', 'Fira Code', monospace;
        }
        #progress-bar {
            flex: 1; -webkit-appearance: none; appearance: none;
            height: 4px; border-radius: 10px; background: var(--border);
            cursor: pointer; outline: none; transition: height var(--transition);
        }
        #progress-bar:hover { height: 6px; }
        #progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: var(--primary); cursor: pointer;
            border: 3px solid #fff; box-shadow: 0 0 14px rgba(0,198,255,0.5);
        }
        #progress-bar::-webkit-slider-thumb:hover { transform: scale(1.2); box-shadow: 0 0 22px rgba(0,198,255,0.8); }

        .controls {
            display: flex; align-items: center; justify-content: center;
            gap: 18px; position: relative; z-index: 1;
        }
        .controls button {
            background: transparent; border: none; color: var(--text);
            font-size: 1.2rem; cursor: pointer; width: 42px; height: 42px;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; transition: all var(--transition);
        }
        .controls button:hover { background: rgba(255,255,255,0.06); color: #fff; }
        .controls button:active { transform: scale(0.9); }
        #play-btn {
            width: 54px; height: 54px; font-size: 1.2rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 50%; color: #fff;
            box-shadow: 0 8px 24px rgba(0,114,255,0.45);
        }
        #play-btn:hover { box-shadow: 0 12px 32px rgba(0,114,255,0.6); transform: scale(1.06); }
        #play-btn:active { transform: scale(0.94); }
        #play-btn.playing {
            background: linear-gradient(135deg, #00f2fe, #00c6ff);
            box-shadow: 0 8px 24px rgba(0,242,254,0.5);
        }

        .tabs-menu {
            display: flex; gap: 3px; background: var(--bg-surface);
            border-radius: var(--radius-sm); padding: 4px; margin-bottom: 16px;
            border: 1px solid var(--border);
        }
        .tab-btn {
            flex: 1; padding: 10px 10px; border: none; background: transparent;
            color: var(--text-secondary); border-radius: var(--radius-xs);
            cursor: pointer; font-size: 0.82rem; font-weight: 500;
            transition: all var(--transition); white-space: nowrap;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff; font-weight: 600; box-shadow: 0 4px 14px rgba(0,114,255,0.3);
        }
        .tab-btn:hover:not(.active) { color: var(--text); background: rgba(255,255,255,0.03); }

        .tab-panel { animation: fadeSlideIn 0.3s ease; }
        .tab-content {
            max-height: 280px; overflow-y: auto; text-align: left;
            scrollbar-width: thin; scrollbar-color: var(--border) transparent;
        }
        .tab-content::-webkit-scrollbar { width: 4px; }
        .tab-content::-webkit-scrollbar-track { background: transparent; }
        .tab-content::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 10px; }
        .music-list { list-style: none; padding-right: 2px; }
        .music-list li {
            display: flex; align-items: center; gap: 10px; padding: 12px 12px;
            border-radius: var(--radius-xs); cursor: pointer;
            transition: all var(--transition); margin-bottom: 2px;
            border: 1px solid transparent; font-size: 0.88rem; position: relative;
        }
        .music-list li:hover { background: var(--bg-surface); border-color: var(--border); }
        .music-list li.active {
            background: rgba(0,198,255,0.1); border-color: rgba(0,198,255,0.3);
            color: var(--primary); font-weight: 600;
            box-shadow: 0 0 15px rgba(0,198,255,0.08);
        }
        .music-list li .song-num {
            width: 30px; height: 30px; border-radius: 50%;
            background: var(--bg-surface); display: flex; align-items: center;
            justify-content: center; font-size: 0.7rem; font-weight: 600;
            color: var(--text-muted); flex-shrink: 0; transition: all var(--transition);
        }
        .music-list li.active .song-num {
            background: var(--primary); color: #fff;
            box-shadow: 0 0 12px rgba(0,198,255,0.5);
        }
        .music-list li .song-detail { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .music-list li .s-name {
            font-weight: 500; font-size: 0.88rem; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .music-list li.active .s-name { color: var(--primary); }
        .music-list li .s-artist {
            font-size: 0.72rem; color: var(--text-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .music-list li .song-dur {
            font-size: 0.72rem; color: var(--text-muted); flex-shrink: 0;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }
        .music-list li .playing-icon {
            display: none; color: var(--primary); font-size: 0.7rem; flex-shrink: 0;
        }
        .music-list li.active .playing-icon { display: inline; animation: pulse 1s infinite; }

        .playlist-item, .folder-item {
            padding: 14px 16px; border-radius: var(--radius-xs); cursor: pointer;
            transition: all var(--transition); margin-bottom: 4px;
            font-size: 0.92rem; color: var(--text); display: flex;
            align-items: center; gap: 10px; border: 1px solid transparent;
        }
        .playlist-item:hover, .folder-item:hover {
            background: var(--bg-surface); border-color: var(--border-light);
            transform: translateX(3px);
        }

        .toast-container {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            z-index: 1000; pointer-events: none;
        }
        .toast {
            background: var(--bg-surface); color: var(--text);
            padding: 10px 24px; border-radius: 30px; font-size: 0.85rem;
            border: 1px solid var(--border-light);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); white-space: nowrap;
            animation: toastIn 0.4s cubic-bezier(0.34,1.56,0.64,1),
                       toastOut 0.3s ease 1.8s forwards;
            max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(30px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-15px) scale(0.9); }
        }

        @media (max-width: 480px) {
            .screen { padding: 22px 14px; border-radius: 22px; max-width: 100%; }
            .album-art { width: 90px; height: 90px; font-size: 2.5rem; }
            .controls button { width: 36px; height: 36px; font-size: 1rem; }
            #play-btn { width: 46px; height: 46px; font-size: 1rem; }
            .tab-btn { font-size: 0.72rem; padding: 8px 6px; }
            .logout-btn { top: 10px; right: 10px; font-size: 0.7rem; padding: 5px 12px; }
        }
    </style>
</head>
<body>
    <!-- ==================== LOGIN SCREEN ==================== -->
    <div id="login-screen" class="screen">
        <span class="login-icon">🎵</span>
        <h2>Bienvenido</h2>
        <p>Ingresa tu nombre para iniciar sesión</p>
        <input type="text" id="username-input" placeholder="Tu nombre aquí..." autocomplete="off" />
        <button id="start-btn">✨ Iniciar Sesión</button>
    </div>

    <!-- ==================== PLAYER SCREEN ==================== -->
    <div id="player-screen" class="screen hidden">
        <button class="logout-btn" id="logout-btn" title="Cerrar sesión">🚪 Salir</button>
        <h3 id="greeting-text">¡Hola! <span class="wave">👋</span></h3>

        <div class="mini-player">
            <div class="album-art" id="album-art">🎧</div>
            <div class="equalizer" id="equalizer">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div>
            </div>
            <div class="song-info">
                <span class="now-playing-badge">▶ Reproduciendo</span>
                <h4 id="song-title">Ninguna canción seleccionada</h4>
                <p id="song-artist">-</p>
            </div>
            <audio id="audio" preload="metadata"></audio>
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <input type="range" id="progress-bar" value="0" max="100" step="0.1" />
                <span id="duration-time">0:00</span>
            </div>
            <div class="controls">
                <button id="prev-btn" title="Anterior">⏮</button>
                <button id="play-btn" title="Reproducir">▶</button>
                <button id="next-btn" title="Siguiente">⏭</button>
            </div>
        </div>

        <div class="tabs-menu">
            <button class="tab-btn active" data-tab="tab-canciones">🎵 Canciones</button>
            <button class="tab-btn" data-tab="tab-playlist">📋 Playlists</button>
            <button class="tab-btn" data-tab="tab-carpeta">📁 Carpeta</button>
        </div>

        <div class="tab-content">
            <div id="tab-canciones" class="tab-panel">
                <ul id="songs-list" class="music-list"></ul>
            </div>
            <div id="tab-playlist" class="tab-panel hidden-panel">
                <div class="playlist-item" data-playlist="favoritas">❤️ Favoritas (Salsa Romántica)</div>
                <div class="playlist-item" data-playlist="concentracion">☕ Para Concentrarse</div>
                <div class="playlist-item" data-playlist="energia">⚡ Energía Mañanera</div>
            </div>
            <div id="tab-carpeta" class="tab-panel hidden-panel">
                <div class="folder-item">📁 /Música/Salsa_2026/</div>
                <div class="folder-item">📁 /Descargas/Nuevas/</div>
                <div class="folder-item">📁 /Audio/Podcasts/</div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        (function() {
            const loginScreen = document.getElementById('login-screen');
            const playerScreen = document.getElementById('player-screen');
            const usernameInput = document.getElementById('username-input');
            const startBtn = document.getElementById('start-btn');
            const greetingText = document.getElementById('greeting-text');
            const songTitleEl = document.getElementById('song-title');
            const songArtistEl = document.getElementById('song-artist');
            const audio = document.getElementById('audio');
            const progressBar = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const durationTimeEl = document.getElementById('duration-time');
            const playBtn = document.getElementById('play-btn');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const songsList = document.getElementById('songs-list');
            const logoutBtn = document.getElementById('logout-btn');
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabPanels = document.querySelectorAll('.tab-panel');
            const albumArt = document.getElementById('album-art');
            const equalizer = document.getElementById('equalizer');
            const nowPlayingBadge = document.querySelector('.now-playing-badge');
            const toastContainer = document.getElementById('toast-container');

            let currentSongIndex = -1;
            let isPlaying = false;
            let songs = [];
            let currentUsername = '';
            let toastTimer = null;

            const defaultSongs = [
                { title: 'Sunset Boulevard', artist: 'Chillwave Collective', duration: '3:42', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', image: 'https://picsum.photos/seed/sunset/300/300', color: '#f59e0b' },
                { title: 'Digital Dreams', artist: 'Synthwave Runner', duration: '4:15', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', image: 'https://picsum.photos/seed/digital/300/300', color: '#8b5cf6' },
                { title: 'Midnight Jazz', artist: 'The Lounge Lizards', duration: '5:01', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3', image: 'https://picsum.photos/seed/jazz/300/300', color: '#3b82f6' },
                { title: 'Acoustic Morning', artist: 'Folk & Fable', duration: '3:28', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3', image: 'https://picsum.photos/seed/acoustic/300/300', color: '#22c55e' },
                { title: 'Electric Pulse', artist: 'Neon Lights', duration: '4:50', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3', image: 'https://picsum.photos/seed/electric/300/300', color: '#ef4444' },
                { title: 'Smooth Sailing', artist: 'Ocean Waves', duration: '4:02', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3', image: 'https://picsum.photos/seed/sailing/300/300', color: '#06b6d4' },
                { title: 'Urban Groove', artist: 'City Beats', duration: '3:55', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3', image: 'https://picsum.photos/seed/urban/300/300', color: '#f472b6' },
            ];

            const playlists = {
                favoritas: [0, 2, 5],
                concentracion: [1, 3, 6],
                energia: [0, 4, 6, 2],
            };

            function showToast(message) {
                if (toastTimer) clearTimeout(toastTimer);
                document.querySelectorAll('.toast').forEach(t => t.remove());
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = message;
                toastContainer.appendChild(toast);
                toastTimer = setTimeout(() => { if (toast.parentNode) toast.remove(); }, 2200);
            }

            function formatTime(seconds) {
                if (isNaN(seconds) || seconds < 0 || !isFinite(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function updatePlayerUI() {
                if (currentSongIndex >= 0 && currentSongIndex < songs.length) {
                    const song = songs[currentSongIndex];
                    songTitleEl.textContent = song.title;
                    songArtistEl.textContent = song.artist;
                    nowPlayingBadge.style.display = 'inline-block';
                    if (song.image) {
                        albumArt.style.backgroundImage = `url('${song.image}')`;
                        albumArt.style.backgroundSize = 'cover';
                        albumArt.style.backgroundPosition = 'center';
                        albumArt.textContent = '';
                        albumArt.style.color = 'transparent';
                    } else {
                        albumArt.style.backgroundImage = '';
                        albumArt.textContent = '🎵';
                        albumArt.style.color = 'rgba(255,255,255,0.7)';
                        albumArt.style.background = `linear-gradient(135deg, ${song.color || '#0072ff'}, rgba(0,0,0,0.3))`;
                    }
                } else {
                    songTitleEl.textContent = 'Ninguna canción seleccionada';
                    songArtistEl.textContent = '-';
                    nowPlayingBadge.style.display = 'none';
                    albumArt.style.backgroundImage = '';
                    albumArt.textContent = '🎧';
                    albumArt.style.color = 'rgba(255,255,255,0.7)';
                    albumArt.style.background = 'linear-gradient(135deg, #0072ff, #00c6ff)';
                }
                updatePlayButton();
                updateEqualizer();
                highlightActiveSong();
            }

            function updatePlayButton() {
                if (isPlaying) {
                    playBtn.textContent = '⏸';
                    playBtn.classList.add('playing');
                    albumArt.classList.add('playing-animation');
                } else {
                    playBtn.textContent = '▶';
                    playBtn.classList.remove('playing');
                    albumArt.classList.remove('playing-animation');
                }
            }

            function updateEqualizer() {
                equalizer.classList.toggle('stopped', !isPlaying);
            }

            function highlightActiveSong() {
                const items = songsList.querySelectorAll('li');
                items.forEach((item, index) => {
                    item.classList.toggle('active', index === currentSongIndex && isPlaying);
                });
            }

            function renderSongsList() {
                songsList.innerHTML = '';
                if (songs.length === 0) {
                    const li = document.createElement('li');
                    li.textContent = '📭 No hay canciones disponibles';
                    li.style.color = 'var(--text-muted)';
                    li.style.cursor = 'default';
                    songsList.appendChild(li);
                    return;
                }
                songs.forEach((song, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span class="song-num">${index + 1}</span>
                        <div class="song-detail">
                            <span class="s-name">${song.title}</span>
                            <span class="s-artist">${song.artist}</span>
                        </div>
                        <span class="playing-icon">🔊</span>
                        <span class="song-dur">${song.duration}</span>
                    `;
                    li.addEventListener('click', () => {
                        if (currentSongIndex === index) togglePlay();
                        else loadAndPlaySong(index);
                    });
                    songsList.appendChild(li);
                });
                highlightActiveSong();
            }

            function loadAndPlaySong(index) {
                if (index < 0 || index >= songs.length || songs.length === 0) return;
                currentSongIndex = index;
                const song = songs[index];
                audio.src = song.src;
                audio.load();
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isPlaying = true;
                        updatePlayerUI();
                        updateMediaSession();
                        showToast(`🎶 ${song.title} - ${song.artist}`);
                    }).catch(() => {
                        isPlaying = false;
                        updatePlayerUI();
                        showToast('⚠️ No se pudo reproducir. Intenta de nuevo.');
                    });
                }
            }

            function togglePlay() {
                if (currentSongIndex < 0) {
                    if (songs.length > 0) loadAndPlaySong(0);
                    else showToast('📭 Agrega canciones primero');
                    return;
                }
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                } else {
                    const playPromise = audio.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => { isPlaying = true; }).catch(() => {
                            isPlaying = false;
                            showToast('⚠️ Error al reproducir');
                        });
                    }
                }
                updatePlayerUI();
                updateMediaSession();
            }

            function playNext() {
                if (songs.length === 0) return;
                const nextIndex = (currentSongIndex + 1) % songs.length;
                loadAndPlaySong(nextIndex);
            }

            function playPrevious() {
                if (songs.length === 0) return;
                const prevIndex = currentSongIndex <= 0 ? songs.length - 1 : currentSongIndex - 1;
                loadAndPlaySong(prevIndex);
            }

            function updateMediaSession() {
                if (!('mediaSession' in navigator)) return;
                if (currentSongIndex >= 0 && currentSongIndex < songs.length && isPlaying) {
                    const song = songs[currentSongIndex];
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: song.title,
                        artist: song.artist,
                        album: 'Mi Reproductor Musical Pro',
                    });
                }
                navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
            }
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', () => { if (!isPlaying && currentSongIndex >= 0) togglePlay(); });
                navigator.mediaSession.setActionHandler('pause', () => { if (isPlaying) togglePlay(); });
                navigator.mediaSession.setActionHandler('previoustrack', playPrevious);
                navigator.mediaSession.setActionHandler('nexttrack', playNext);
            }

            audio.addEventListener('loadedmetadata', () => {
                if (audio.duration && isFinite(audio.duration)) {
                    durationTimeEl.textContent = formatTime(audio.duration);
                    progressBar.max = audio.duration;
                }
            });
            audio.addEventListener('timeupdate', () => {
                if (!isNaN(audio.currentTime) && isFinite(audio.currentTime)) {
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                    progressBar.value = audio.currentTime;
                    if (audio.duration && isFinite(audio.duration)) {
                        durationTimeEl.textContent = formatTime(audio.duration);
                        progressBar.max = audio.duration;
                    }
                }
            });
            audio.addEventListener('ended', () => {
                isPlaying = false;
                updatePlayerUI();
                updateMediaSession();
                setTimeout(() => { if (!isPlaying) playNext(); }, 500);
            });
            audio.addEventListener('play', () => { isPlaying = true; updatePlayerUI(); updateMediaSession(); });
            audio.addEventListener('pause', () => { isPlaying = false; updatePlayerUI(); updateMediaSession(); });
            audio.addEventListener('error', () => { isPlaying = false; updatePlayerUI(); showToast('⚠️ Error al cargar el audio'); });

            progressBar.addEventListener('input', () => {
                const time = parseFloat(progressBar.value);
                if (!isNaN(time) && isFinite(time) && audio.duration) {
                    audio.currentTime = time;
                    currentTimeEl.textContent = formatTime(time);
                }
            });

            playBtn.addEventListener('click', togglePlay);
            nextBtn.addEventListener('click', playNext);
            prevBtn.addEventListener('click', playPrevious);

            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetTab = btn.getAttribute('data-tab');
                    tabBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    tabPanels.forEach(panel => panel.classList.toggle('hidden-panel', panel.id !== targetTab));
                });
            });

            document.querySelectorAll('.playlist-item').forEach(item => {
                item.addEventListener('click', () => {
                    const playlistKey = item.getAttribute('data-playlist');
                    if (playlistKey && playlists[playlistKey] && playlists[playlistKey].length > 0) {
                        tabBtns.forEach(b => b.classList.remove('active'));
                        const songsTabBtn = document.querySelector('[data-tab="tab-canciones"]');
                        if (songsTabBtn) songsTabBtn.classList.add('active');
                        tabPanels.forEach(panel => panel.classList.toggle('hidden-panel', panel.id !== 'tab-canciones'));
                        loadAndPlaySong(playlists[playlistKey][0]);
                        showToast(`📋 Playlist: ${item.textContent.trim()}`);
                    }
                });
            });
            document.querySelectorAll('.folder-item').forEach(item => {
                item.addEventListener('click', () => showToast(`📁 Carpeta: ${item.textContent.trim()}`));
            });

            function handleLogin() {
                const name = usernameInput.value.trim();
                if (!name) {
                    showToast('😊 Por favor, ingresa tu nombre');
                    usernameInput.style.borderColor = 'var(--danger)';
                    usernameInput.focus();
                    setTimeout(() => usernameInput.style.borderColor = 'var(--border)', 1000);
                    return;
                }
                currentUsername = name;
                // Opcional: guardar en localStorage para recordar
                // localStorage.setItem('musicPlayerUsername', name);
                showPlayerScreen(name);
            }

            function showPlayerScreen(name) {
                loginScreen.classList.add('hidden');
                playerScreen.classList.remove('hidden');
                greetingText.innerHTML = `¡Hola, ${escapeHTML(name)}! <span class="wave">👋</span>`;
                songs = [...defaultSongs];
                renderSongsList();
                currentSongIndex = -1;
                isPlaying = false;
                audio.src = '';
                audio.load();
                currentTimeEl.textContent = '0:00';
                durationTimeEl.textContent = '0:00';
                progressBar.value = 0;
                updatePlayerUI();
                showToast(`👋 ¡Bienvenido, ${escapeHTML(name)}!`);
            }

            function handleLogout() {
                audio.pause();
                audio.src = '';
                audio.load();
                currentSongIndex = -1;
                isPlaying = false;
                songs = [];
                songsList.innerHTML = '';
                playerScreen.classList.add('hidden');
                loginScreen.classList.remove('hidden');
                usernameInput.value = '';
                currentTimeEl.textContent = '0:00';
                durationTimeEl.textContent = '0:00';
                progressBar.value = 0;
                updatePlayerUI();
                // Limpiar cualquier nombre guardado
                localStorage.removeItem('musicPlayerUsername');
                currentUsername = '';
                showToast('👋 Sesión cerrada. ¡Hasta pronto!');
            }

            startBtn.addEventListener('click', handleLogin);
            logoutBtn.addEventListener('click', handleLogout);
            usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); handleLogin(); } });

            document.addEventListener('keydown', (e) => {
                if (loginScreen.classList.contains('hidden') === false) return;
                const tag = document.activeElement?.tagName?.toLowerCase();
                if (tag === 'input' || tag === 'textarea') return;
                if (e.key === ' ') { e.preventDefault(); togglePlay(); }
                if (e.key === 'ArrowRight' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); playNext(); }
                if (e.key === 'ArrowLeft' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); playPrevious(); }
            });

            // INICIALIZACIÓN: siempre mostrar login, sin recordar sesión anterior
            function init() {
                // Forzamos que siempre se vea el login, ignorando localStorage
                loginScreen.classList.remove('hidden');
                playerScreen.classList.add('hidden');
                usernameInput.focus();
                equalizer.classList.add('stopped');
            }
            init();
        })();
    </script>
</body>
</html>
