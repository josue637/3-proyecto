<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Reproductor Musical Pro</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="login-screen" class="screen">
      <h2>Bienvenido</h2>
      <p>Ingresa tu nombre para iniciar sesión</p>
      <input type="text" id="username-input" placeholder="Tu nombre aquí..." />
      <button id="start-btn">Iniciar Sesión</button>
    </div>

    <div id="player-screen" class="screen hidden">
      <h3 id="greeting-text">¡Hola!</h3>

      <div class="mini-player">
        <div class="song-info">
          <h4 id="song-title">Ninguna canción seleccionada</h4>
          <p id="song-artist">-</p>
        </div>
        <audio id="audio"></audio>
        <div class="progress-container">
          <span id="current-time">0:00</span>
          <input type="range" id="progress-bar" value="0" max="100" />
          <span id="duration-time">0:00</span>
        </div>
        <div class="controls">
          <button id="prev-btn">⏮</button>
          <button id="play-btn">▶</button>
          <button id="next-btn">⏭</button>
        </div>
      </div>

      <div class="tabs-menu">
        <button class="tab-btn active" data-tab="tab-canciones">
          Canciones
        </button>
        <button class="tab-btn" data-tab="tab-playlist">Playlists</button>
        <button class="tab-btn" data-tab="tab-carpeta">Carpeta</button>
      </div>

      <div class="tab-content">
        <div id="tab-canciones" class="tab-panel">
          <ul id="songs-list" class="music-list"></ul>
        </div>

        <div id="tab-playlist" class="tab-panel hidden-panel">
          <div class="playlist-item">❤️ Favoritas (Salsa Romántica)</div>
          <div class="playlist-item">☕ Para Concentrarse</div>
          <div class="playlist-item">⚡ Energía Mañanera</div>
        </div>

        <div id="tab-carpeta" class="tab-panel hidden-panel">
          <div class="folder-item">📁 /Música/Salsa_2026/</div>
          <div class="folder-item">📁 /Descargas/Nuevas/</div>
          <div class="folder-item">📁 /Audio/Podcasts/</div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
